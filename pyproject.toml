[project]
name = "mandate"
version = "0.1.0"
description = "Independent authorization and verification layer between AI agents and the world."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["cryptography>=42", "pyjwt>=2.10", "openai>=3.42", "httpx2>=2.16", "mcp==2.3.0", "uvicorn==0.54.0", "starlette==1.10.0", "increase==0.555.0"]

[project.scripts]
mandate = "mandate.cli:main"
mandate-hook = "swarm.hook:cli"
mandate-desk = "swarm.server:cli"
mandate-console = "swarm.console:cli"
mandate-bank-setup = "bank.increase:setup_cli"
mandate-holder-proof = "swarm.holder_proof:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gate", "evidence", "bank", "zk", "swarm", "mandate"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "bank.test_credentials",
    "bank.test_increase",
    "bank.test_rail",
    "bank.test_reconcile",
    "bank.test_verifier",
    "bench.test_report",
