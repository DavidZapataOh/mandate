ignore_errors = true

[[tool.mypy.overrides]]
module = ["demo.swarm_repo.*", "payments.*", "test_handler"]
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentimestamps.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["bank", "bench", "demo", "evidence", "gate", "mandate", "swarm", "zk"]
omit = ["*/test_*.py", "*/conftest.py", "demo/swarm_repo/*"]

[tool.coverage.report]
fail_under = 93
precision = 2
skip_covered = true
show_missing = true

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-m 'not live'"
markers = ["live: tests requiring live external services"]
