[project]
name = "mandate"
version = "0.1.0"
description = "Independent authorization and verification layer between AI agents and the world."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["cryptography>=42", "pyjwt>=2.10", "openai>=3.42", "httpx2>=2.16"]

[project.scripts]
mandate = "mandate.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gate", "evidence", "bank", "zk", "swarm", "mandate"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "bank.test_verifier",
    "bench.test_report",
    "bench.test_runner",
    "e2e.test_drills_service",
    "e2e.test_flow_a",
    "e2e.test_smoke_imports",
    "evidence.test_evidence",
    "evidence.test_tlsn_live",
    "gate.test_approval",
    "gate.test_broker",
    "gate.test_cava",
    "gate.test_certs",
    "gate.test_mcp_proxy",
    "gate.test_perf",
    "gate.test_policy",
    "gate.test_registry",
    "gate.test_shim",
    "gate.test_vault",
    "demo.test_make_bill",
    "swarm.test_meta_client",
    "mandate.test_sdk",
    "zk.test_circuit_live",
    "zk.test_settle",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["live: tests requiring live external services"]
